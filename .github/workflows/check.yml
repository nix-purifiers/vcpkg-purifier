name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Capture initial native ARM example profile
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          nix build '.#cli'
          ./result/bin/vcpkg-purifier --project examples/minimal lock
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-24.04-arm'
        with:
          name: native-arm-example
          path: |
            examples/minimal/vcpkg-lock.json
            examples/minimal/vcpkg-purifier.lock.json
      - run: python3 tests/eval-errors.py
      - run: nix flake check -L
      - run: tests/conformance-rebuild.sh
  conformance:
    name: conformance-${{ matrix.case }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        case: [relock, update, external, native, local]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: python3 tests/host-conformance.py "${{ matrix.case }}"
